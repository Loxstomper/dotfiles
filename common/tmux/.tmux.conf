# Tmux configuration for v3.5a with Solarized Dark theme and vim bindings

# Set true color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Set prefix key to Ctrl-a (uncomment if preferred over default Ctrl-b)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim-style key bindings
setw -g mode-keys vi

# Vim-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-style copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# OSC 52: yanks in copy-mode reach the local macOS clipboard, even over SSH
set -g set-clipboard on
set -g allow-passthrough on

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Quick window switching
bind -n M-H previous-window
bind -n M-L next-window

# -----------------------------
# Sessionizer
# -----------------------------

# prefix+f: fuzzy-pick any project (zoxide frecency + ~/development), create or switch
bind f display-popup -E -w 70% -h 70% "~/.local/bin/tmux-sessionizer"

# prefix+s: switch between live sessions (ctrl-x kills) - replaces choose-tree
bind s display-popup -E -w 60% -h 50% "~/.local/bin/tmux-sessions"

# Killing a session hands the client to another one instead of dumping you to the shell
set -g detach-on-destroy off

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Don't rename windows automatically
set-option -g allow-rename off
# The other half of the pair: stops tmux renaming windows after the running process
set-option -gw automatic-rename off

# Increase scrollback buffer size
set -g history-limit 50000

# Escape time for vim
set -sg escape-time 0

# Focus events enabled for terminals that support them
set -g focus-events on

# Aggressive resize
setw -g aggressive-resize on

# -----------------------------
# Solarized Dark Color Scheme
# -----------------------------

# Base status bar colors
set -g status-style 'bg=#002b36,fg=#839496'

# Window status colors
setw -g window-status-style 'fg=#586e75,bg=#002b36'
setw -g window-status-current-style 'fg=#fdf6e3,bg=#268bd2,bold'
setw -g window-status-activity-style 'fg=#dc322f,bg=#002b36'

# Pane border colors
set -g pane-border-style 'fg=#073642'
set -g pane-active-border-style 'fg=#268bd2'

# Message colors
set -g message-style 'fg=#fdf6e3,bg=#268bd2'
set -g message-command-style 'fg=#fdf6e3,bg=#268bd2'

# Clock color
setw -g clock-mode-colour '#268bd2'

# -----------------------------
# Status bar configuration
# -----------------------------

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# Left side of status bar
set -g status-left-length 40
set -g status-left '#[fg=#fdf6e3,bg=#268bd2,bold] #S #[fg=#268bd2,bg=#073642,nobold]#[fg=#839496,bg=#073642] #(whoami) #[fg=#073642,bg=#002b36]'

# Right side of status bar
set -g status-right-length 150
set -g status-right '#[fg=#073642,bg=#002b36]#[fg=#6c71c4,bg=#073642] #(cd "#{pane_current_path}" && git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "no git") #[fg=#2aa198]#(kubectl config current-context 2>/dev/null | cut -d/ -f1 || echo "") #[fg=#268bd2,bg=#073642]#[fg=#fdf6e3,bg=#268bd2,bold] %H:%M %d-%b '

# Window status format
# Label windows by directory, not process name. A manual rename-window still wins.
setw -g window-status-format ' #I:#{?#{==:#{window_name},zsh},#{b:pane_current_path},#W}#F '
setw -g window-status-current-format ' #I:#{?#{==:#{window_name},zsh},#{b:pane_current_path},#W}#F '

# Activity monitoring
setw -g monitor-activity on

# Plugins (TPM). The installer clones tpm and runs install_plugins; on an
# existing machine `prefix I` does the same.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix C-s save, prefix C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save every 15 min, restore on server start

set -g @resurrect-capture-pane-contents 'on'   # scrollback comes back too
set -g @continuum-restore 'on'

# must stay the last line
run '~/.tmux/plugins/tpm/tpm'
