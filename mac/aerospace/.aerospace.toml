# AeroSpace configuration — https://nikitabobko.github.io/AeroSpace/guide

# Commands run after AeroSpace.app is launched / after startup
after-login-command = []
after-startup-command = []

# Notify SketchyBar whenever the focused workspace changes.
# Full path is required: AeroSpace runs with a minimal GUI PATH.
exec-on-workspace-change = [
  '/bin/bash', '-c',
  '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

# Launch AeroSpace at login
start-at-login = true

# Normalizations — https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Layouts
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus when the monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Mouse follows focus at the window level. 'lazy' only moves the cursor when
# it is not already inside the focused window, so it never yanks the pointer
# off something you are already hovering.
on-focus-changed = ['move-mouse window-lazy-center']

# Gaps between windows / screen edges.
# SketchyBar fills the built-in's reserved menu-bar strip; outer.top adds a
# small gap between the bar and the tiled windows below it.
[gaps]
inner.horizontal = 16
inner.vertical = 16
outer.left = 16
outer.right = 16
# Per-monitor top gap so windows always clear SketchyBar with a 16pt gap.
# AeroSpace tiles inside each monitor's visible frame, so the gap only has to
# cover the part of the bar macOS has NOT already reserved. Reserved space is
# the notch strip on the built-in and zero on every external, so the formula is
# (bar height + 16) - reserved. The trailing value is the default and also
# covers projectors (reserved 0 when the laptop is primary).
#
# The bar height changes with the display profile (~/.config/sketchybar/sizes.sh
# — 64pt when the built-in runs 1:1, 38pt when it runs HiDPI), so the line below
# is REGENERATED by plugins/display.sh on every profile switch. Change AERO_GAP
# in sizes.sh rather than editing it here; hand edits are overwritten.
outer.top = [{ monitor.'built-in' = 22 }, 60]  # generated by display.sh
outer.bottom = 16

# Workspace → monitor assignment.
# Each workspace prefers a named monitor and falls back down the list when that
# monitor is absent (main = the macOS primary/menu-bar display; secondary = any
# other connected display). This one static block self-adapts to every setup:
#   Home (3 displays): 1-4 40" ultrawide, 5-7 34" ultrawide, 8-9 laptop.
#   Presentation (laptop + projector): 1-4 & 8-9 on laptop, 5-7 on the projector
#     via the 'secondary' fallback, so dragged windows land on a reachable ws.
#   Laptop only: every name misses, so 1-9 all fall back to the built-in display.
# Names must match the monitor exactly; a name that misses falls through to the
# next entry silently, so re-check them after a monitor swap —
# `display.sh save home` prints the live names to drop in here.
[workspace-to-monitor-force-assignment]
1 = ['KAMN40DQUCWA', 'main']
2 = ['KAMN40DQUCWA', 'main']
3 = ['KAMN40DQUCWA', 'main']
4 = ['KAMN40DQUCWA', 'main']
5 = ['DELL U3425WE', 'secondary']
6 = ['DELL U3425WE', 'secondary']
7 = ['DELL U3425WE', 'secondary']
8 = ['built-in', 'main']
9 = ['built-in', 'main']

# Main mode — alt (Option) is the modifier.
[mode.main.binding]

# Layout toggles
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus (vim-style, matches your tmux bindings)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move the focused window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Fullscreen / floating - joystick centre press on the Sofle
alt-f = 'fullscreen'
alt-shift-f = 'layout floating tiling'

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Switch to workspace
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move the focused window to a workspace (and refresh the bar's app icons)
alt-shift-1 = ['move-node-to-workspace 1', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change']
alt-shift-2 = ['move-node-to-workspace 2', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change']
alt-shift-3 = ['move-node-to-workspace 3', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change']
alt-shift-4 = ['move-node-to-workspace 4', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change']
alt-shift-5 = ['move-node-to-workspace 5', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change']
alt-shift-6 = ['move-node-to-workspace 6', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change']
alt-shift-7 = ['move-node-to-workspace 7', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change']
alt-shift-8 = ['move-node-to-workspace 8', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change']
alt-shift-9 = ['move-node-to-workspace 9', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change']

# Workspace navigation
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Safety net: cycle through ALL non-empty workspaces by position, regardless of
# number. Guarantees a window on any workspace (even a stray 10+) is reachable.
alt-ctrl-l = 'workspace --wrap-around next'
alt-ctrl-h = 'workspace --wrap-around prev'

# Enter service mode (also tells SketchyBar to show the mode indicator)
alt-shift-semicolon = ['mode service', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=service']

# Service mode — less-frequent actions, press esc to leave.
# Each binding returns to main mode and notifies SketchyBar.
[mode.service.binding]
esc = ['reload-config', 'mode main', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=main']
r = ['flatten-workspace-tree', 'mode main', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=main']
f = ['layout floating tiling', 'mode main', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=main']
backspace = ['close-all-windows-but-current', 'mode main', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=main']

# Join the focused window with a neighbour
alt-shift-h = ['join-with left', 'mode main', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=main']
alt-shift-j = ['join-with down', 'mode main', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=main']
alt-shift-k = ['join-with up', 'mode main', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=main']
alt-shift-l = ['join-with right', 'mode main', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=main']
